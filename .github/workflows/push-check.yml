name: Push reminder check

on:
  # Re-enabled 2026-09-01 — Upstash quota reset confirmed (a direct call to
  # /api/push-check now returns 200 instead of the 500 it gave while the
  # free 500k/month limit was exhausted).
  schedule:
    # GitHub already delays/drops runs this frequent under platform load —
    # real-world cadence measured at 1-3.5h regardless of the 5-minute
    # setting, so 15 minutes is honest about what actually happens rather
    # than requesting a granularity GitHub doesn't deliver.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push-check
        run: curl -sf "https://ai-time-manager-two.vercel.app/api/push-check?secret=${{ secrets.PUSH_CHECK_SECRET }}"
