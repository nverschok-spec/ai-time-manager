name: Push reminder check

on:
  # Schedule TEMPORARILY DISABLED (2026-08-19) — Upstash's free 500k/month
  # request limit is exhausted, so every run just fails against a 500 and
  # spams a GitHub failure email every ~15min for no benefit (pushes aren't
  # being delivered either way while the limit holds). Restore the schedule
  # block below once the Upstash quota resets — check Vercel → Storage →
  # this DB → Open in Upstash → Usage for the reset date:
  #
  # schedule:
  #   # GitHub already delays/drops runs this frequent under platform load —
  #   # real-world cadence measured at 1-3.5h regardless of the 5-minute
  #   # setting, so 15 minutes is honest about what actually happens rather
  #   # than requesting a granularity GitHub doesn't deliver.
  #   - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push-check
        run: curl -sf "https://ai-time-manager-two.vercel.app/api/push-check?secret=${{ secrets.PUSH_CHECK_SECRET }}"
