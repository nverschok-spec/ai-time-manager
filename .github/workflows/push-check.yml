name: Push reminder check

on:
  # Schedule DISABLED 2026-09-16 — GitHub's scheduled-workflow trigger turned
  # out to be far less reliable than advertised: measured over the last 100
  # runs, actual cadence was a median of ~3.4h (up to 6.5h) between runs
  # despite the */15-minute cron, which made reminders arrive hours late.
  # Replaced with an Upstash QStash schedule (scheduleId
  # scd_7vBnQE81erQ71CSXMqUFCXF5MvFZ, */2 * * * *) hitting this same
  # endpoint directly — QStash is an actual reliable cron/queue product,
  # not a best-effort trigger. Manage the schedule at
  # https://console.upstash.com/qstash (or via its REST API), not here.
  # kept as workflow_dispatch only, for manual testing.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push-check
        run: curl -sf "https://ai-time-manager-two.vercel.app/api/push-check?secret=${{ secrets.PUSH_CHECK_SECRET }}"
