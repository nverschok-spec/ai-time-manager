name: Keep-alive

# GitHub disables ALL scheduled workflows in a repo after 60 days with no
# repository activity — including push-check.yml, which is what actually
# delivers reminder notifications. An empty commit once a month counts as
# activity and resets that clock indefinitely, with no third-party service
# or manual action needed.
on:
  schedule:
    - cron: '0 3 1 * *' # 03:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit to keep scheduled workflows enabled
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive commit (prevents GitHub from disabling scheduled workflows after 60 days idle)"
          git push
